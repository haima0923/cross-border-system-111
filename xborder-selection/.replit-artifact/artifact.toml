kind = "web"
previewPath = "/"
title = "跨境选品系统 V1"
version = "1.0.0"
id = "artifacts/xborder-selection"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23578

[services.development]
run = "pnpm --filter @workspace/xborder-selection run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xborder-selection", "run", "build" ]
publicDir = "artifacts/xborder-selection/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23578"
BASE_PATH = "/"
